name: Build EDUFIXiarz

on:
  push:
    branches: ["main", "dev", "develop"]
  pull_request:
    branches: ["main", "dev", "develop"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build EDUFIXiarz.sln -c Release

      - name: Publish
        run: dotnet publish src/EDUFIXiarz/EDUFIXiarz.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EDUFIXiarz-win-x64
          path: publish/
